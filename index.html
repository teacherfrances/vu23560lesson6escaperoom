<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locked in the lunchroom</title>
<style>
:root{
  --board:#17201b; --board2:#1f2a24; --chalk:#f4f1e8; --dim:#b9c2b4; --line:#5d6b62;
  --tomato:#ff6b5b; --mustard:#ffc94d; --mint:#5fe0a6; --sky:#5cc4ff; --grape:#c39bff; --peach:#ffa47a; --pink:#ff8fc6; --lime:#c6f06a;
  --ink:#1b1b1b; --paper:#fffaf0; --kraft:#e9cfa4;
  --rc:var(--mustard);
  --disp:"Segoe UI Black","Arial Black","Segoe UI",Carlito,Calibri,system-ui,sans-serif;
  --body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Lucida Console","DejaVu Sans Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html{font-size:24px}
body{margin:0;min-height:100vh;font-family:var(--body);color:var(--chalk);line-height:1.35;
  background-color:var(--board);
  background-image:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.06),transparent 55%),radial-gradient(ellipse at 80% 90%,rgba(255,255,255,.05),transparent 50%),
    repeating-linear-gradient(115deg,rgba(255,255,255,.012) 0 3px,transparent 3px 9px);
  background-attachment:fixed;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid var(--mustard);outline-offset:3px}
.disp{font-family:var(--disp);font-weight:900}
/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;padding:.35rem .6rem;background:#0e1411;border-bottom:4px dashed var(--line)}
.brand{font-family:var(--disp);font-weight:900;font-size:.95rem;color:var(--mustard);flex:1 1 9em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:.3em;border:3px solid var(--line);border-radius:999px;padding:.1em .6em;font-weight:800;font-size:.85rem;background:var(--board2)}
.tb{background:var(--paper);color:var(--ink);border:0;border-radius:12px;font-weight:900;min-width:52px;min-height:52px;padding:0 .5em;font-size:.9rem}
main{max-width:1100px;margin:0 auto;padding:.8rem .8rem 3rem;overflow-wrap:break-word}
/* ---------- shared ---------- */
.sign{display:flex;align-items:center;gap:.6em;border:4px solid var(--chalk);border-radius:18px;padding:.4em .8em;margin:.3em 0 .7em;background:var(--board2);box-shadow:0 0 0 6px var(--board),0 0 0 9px var(--rc)}
.sign .ic{font-size:2em;line-height:1}
.sign .tx{font-family:var(--disp);font-weight:900;font-size:1.2em;line-height:1.15}
.sign small{display:block;font-family:var(--body);font-weight:700;font-size:.62em;color:var(--dim)}
.sign.big .tx{font-size:1.6em}
.panel{border:3px dashed var(--line);border-radius:18px;padding:.6em .9em;margin:.6em 0;background:rgba(255,255,255,.03)}
.panel.note{border-style:solid;border-color:var(--rc);background:rgba(255,255,255,.05)}
.chat{display:flex;gap:.5em;align-items:flex-start;margin:.5em 0}
.chat .av{flex:none;width:2.2em;height:2.2em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3em;background:var(--mustard);border:3px solid var(--chalk)}
.chat .bub{background:var(--paper);color:var(--ink);border-radius:4px 18px 18px 18px;padding:.45em .8em;font-weight:600}
.chat .bub b{display:block;font-size:.75em;color:#7a5a12}
.row{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.center{text-align:center}
.mute{color:var(--dim)}
.small{font-size:.8em}
.bb{border:4px solid var(--chalk);background:transparent;border-radius:16px;font-weight:900;min-height:64px;padding:.2em 1em;font-size:1em}
.bb.go{background:var(--mustard);color:var(--ink);border-color:var(--mustard)}
.bb.sm{min-height:56px;font-size:.9em}
.fb{border-radius:14px;padding:.45em .8em;margin:.5em 0;font-weight:800;border:3px solid}
.fb.ok{border-color:var(--mint);background:rgba(95,224,166,.12)}
.fb.no{border-color:var(--tomato);background:rgba(255,107,91,.12)}
.q{font-weight:800;font-size:1.1em;margin:.4em 0}
.dots{display:flex;gap:.35em;margin:.3em 0}
.dots i{width:.8em;height:.8em;border-radius:50%;border:3px solid var(--rc)}
.dots i.on{background:var(--rc)}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.burst{position:fixed;pointer-events:none;z-index:200;font-size:2rem;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
#conf{position:fixed;inset:0;pointer-events:none;z-index:300}
.namebox{font:inherit;width:100%;max-width:18em;border:4px solid var(--chalk);border-radius:14px;padding:.3em .6em;background:var(--paper);color:var(--ink);font-weight:800;min-height:60px}
/* ---------- start ---------- */
.menuboard{border:6px solid #6b4a2b;border-radius:22px;background:var(--board2);padding:.8em 1em;box-shadow:inset 0 0 0 3px #3b2a19,0 10px 0 #0b0f0d}
.menuboard h1{margin:.1em 0;font-family:var(--disp);font-weight:900;font-size:2em;color:var(--mustard);line-height:1.1}
.menuboard .clock{font-family:var(--mono);font-weight:700;font-size:1.3em;color:var(--tomato)}
/* ---------- map ---------- */
.welcome{border:4px solid var(--mint);border-radius:18px;padding:.5em .8em;background:rgba(95,224,166,.1);font-weight:800;margin:.5em 0}
.zone{margin:1em 0 .3em;font-family:var(--disp);font-weight:900;font-size:1em;color:var(--dim);letter-spacing:.06em}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5em,1fr));gap:.7em}
.st{position:relative;text-align:left;border:4px solid var(--sc);border-radius:20px;background:var(--board2);padding:.55em .7em .6em;min-height:7.2em;display:flex;flex-direction:column;gap:.15em;box-shadow:0 7px 0 #0b0f0d}
.st:active{transform:translateY(3px);box-shadow:0 4px 0 #0b0f0d}
.st .em{font-size:2.3em;line-height:1}
.st .nm{font-family:var(--disp);font-weight:900;font-size:1.02em;line-height:1.1}
.st .sk{font-size:.8em;color:var(--dim);font-weight:700}
.st .stat{margin-top:auto;align-self:flex-start;border-radius:999px;padding:.05em .6em;font-weight:900;font-size:.8em;background:var(--sc);color:var(--ink)}
.st.locked .stat{background:transparent;color:var(--sc);border:3px solid var(--sc)}
.st .teach{position:absolute;top:.35em;right:.45em;font-size:1.2em}
.st.done{background:repeating-linear-gradient(135deg,var(--board2) 0 14px,rgba(255,255,255,.05) 14px 28px)}
.st .lt{position:absolute;right:.4em;bottom:.4em;width:1.7em;height:1.7em;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;background:var(--paper);color:var(--ink);font-size:1.1em;transform:rotate(6deg)}
.tray{display:flex;flex-wrap:wrap;gap:.3em;align-items:center}
.tray .tl{width:1.6em;height:1.6em;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;background:var(--paper);color:var(--ink)}
.tray .tl.e{background:transparent;border:3px dashed var(--line);color:var(--line)}
.exit{display:flex;align-items:center;gap:.6em;width:100%;margin-top:1em;border:5px solid var(--line);border-radius:22px;background:var(--board2);padding:.6em 1em;font-weight:900;font-size:1.05em;min-height:84px;text-align:left}
.exit.open{border-color:var(--mint);background:rgba(95,224,166,.12)}
.exit .em{font-size:2em}
.again{margin-top:1.2em}
/* ---------- unlocked ---------- */
.unlock{border:5px solid var(--mint);border-radius:22px;padding:.8em;margin:1em 0;text-align:center;background:rgba(95,224,166,.08)}
.unlock .big{font-family:var(--disp);font-weight:900;font-size:1.4em;color:var(--mint)}
.unlock .lt{display:inline-flex;width:2.4em;height:2.4em;border-radius:14px;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font-family:var(--disp);font-weight:900;font-size:1.8em;margin:.2em 0;transform:rotate(-5deg)}
/* ---------- 1 fridge ---------- */
.fridge{display:grid;grid-template-columns:minmax(0,1fr);gap:.6em;background:linear-gradient(180deg,#e8eef2,#c9d3da);border-radius:26px;padding:.8em;border:5px solid #9aa7b0;color:var(--ink);position:relative}
.fridge:before{content:"";position:absolute;right:.6em;top:1.2em;width:.5em;height:4em;border-radius:6px;background:#8d99a2}
.fnote{background:#fff59a;border-radius:4px;padding:.6em .8em;box-shadow:0 6px 10px rgba(0,0,0,.18);transform:rotate(-1.2deg);font-weight:700;margin-right:1.2em}
.fnote .who{font-weight:900;color:#7a5a12}
.gap{display:inline-block;min-width:5.5em;border-bottom:4px dashed #7a5a12;text-align:center;font-weight:900;padding:0 .2em}
.gap.filled{border-bottom-style:solid;color:#0b6e3f}
.magnets{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center}
.mag{border:0;border-radius:999px;padding:.3em .9em;min-height:64px;font-weight:900;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35);transform:rotate(var(--r,0deg))}
.mag.fall{animation:fall .7s forwards}
@keyframes fall{to{transform:translateY(60px) rotate(40deg);opacity:0}}
/* ---------- 2 microwave ---------- */
.mw{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:.6em;background:#2d3338;border:5px solid #8c969d;border-radius:22px;padding:.7em}
.mwin{border-radius:16px;background:#101416;border:4px solid #5b666d;padding:.7em;display:flex;flex-direction:column;justify-content:center;gap:.4em;min-height:8em;position:relative;overflow:hidden}
.mwin.hot{box-shadow:inset 0 0 40px rgba(255,201,77,.6);border-color:var(--mustard)}
.mdisp{font-family:var(--mono);font-weight:700;background:#05251a;color:#6dffb0;border-radius:10px;padding:.25em .5em;min-height:2em;font-size:.95em;overflow-wrap:anywhere}
.mkeys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4em}
.mk{background:#e4e8ea;color:var(--ink);border:0;border-radius:12px;min-height:60px;font-weight:900;font-size:.9em;box-shadow:0 4px 0 #8c969d}
.mk.on{background:var(--mustard)}
.mk:active{transform:translateY(2px);box-shadow:0 2px 0 #8c969d}
@media (max-width:640px){.mw{grid-template-columns:1fr}}
/* ---------- 3 vending ---------- */
.vend{background:#b3263a;border:5px solid #6d1422;border-radius:22px;padding:.7em;display:grid;grid-template-columns:minmax(0,1fr);gap:.6em}
.vscreen{background:#0d1a2a;border:4px solid #2a4a6b;border-radius:12px;padding:.5em .7em;font-weight:800;color:#cfe8ff}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45em;background:#e7eef3;border-radius:14px;padding:.5em}
.vslot{border:3px solid #9fb0bd;border-radius:12px;background:#fff;color:var(--ink);min-height:88px;padding:.3em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;font-weight:800;font-size:.85em;line-height:1.1;text-align:center}
.vslot .code{font-family:var(--mono);font-size:.8em;background:var(--ink);color:#fff;border-radius:6px;padding:0 .35em}
.vslot .sn{font-size:1.4em}
.vslot.drop .sn{animation:drop .8s forwards}
@keyframes drop{60%{transform:translateY(70px)}100%{transform:translateY(70px);opacity:0}}
.vbin{background:#2b0b12;border-radius:12px;min-height:3em;display:flex;align-items:center;gap:.3em;padding:.3em .6em;font-size:1.4em;flex-wrap:wrap}
/* ---------- 4 conveyor ---------- */
.belt{position:relative;height:6.5em;border-radius:18px;background:repeating-linear-gradient(90deg,#3a4540 0 26px,#2c3531 26px 52px);border:4px solid #6f7d75;overflow:hidden;display:flex;align-items:center;justify-content:center}
.belt.move{animation:belt 1s linear infinite}
@keyframes belt{to{background-position:52px 0}}
.item{background:var(--paper);color:var(--ink);border-radius:16px;padding:.35em .9em;font-weight:900;font-size:1.15em;box-shadow:0 6px 0 rgba(0,0,0,.35);animation:slidein .6s ease-out}
@keyframes slidein{from{transform:translateX(-120%)}to{transform:translateX(0)}}
.item.out-l{animation:outl .5s forwards}.item.out-r{animation:outr .5s forwards}
@keyframes outl{to{transform:translate(-60%,140%) rotate(-25deg);opacity:0}}@keyframes outr{to{transform:translate(60%,140%) rotate(25deg);opacity:0}}
.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6em;margin-top:.6em}
.bin{border:5px solid;border-radius:20px;min-height:110px;font-weight:900;font-size:1.05em;background:var(--board2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em}
.bin .cnt{font-family:var(--mono);font-size:.85em;color:var(--dim)}
/* ---------- 5 sandwich ---------- */
.sand{display:flex;flex-direction:column;align-items:center;gap:.15em;margin:.5em 0}
.bread{width:min(100%,26em);background:linear-gradient(#e7b56d,#c98a3d);color:var(--ink);border-radius:40px 40px 14px 14px;padding:.55em 1em;font-weight:900;text-align:center;border:4px solid #8a5a22}
.bread.bot{border-radius:14px 14px 30px 30px}
.fill{width:min(92%,24em);border-radius:10px;padding:.35em .8em;text-align:center;font-weight:900;color:var(--ink);border:3px dashed var(--line);background:transparent;color:var(--dim)}
.fill.set{border:0;background:linear-gradient(90deg,#7bd36b,#f15b4c 50%,#ffd35a);color:var(--ink)}
.choices{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;margin:.5em 0}
.ch{border:4px solid var(--rc);background:var(--board2);border-radius:16px;min-height:64px;padding:.2em .9em;font-weight:900;font-size:1em}
.ch.wrong{border-color:var(--tomato);opacity:.55;text-decoration:line-through}
.ch.wide{width:min(100%,24em)}
/* ---------- 6 kettle ---------- */
.kettle{display:grid;grid-template-columns:7em minmax(0,1fr);gap:.8em;align-items:center}
.kbody{position:relative;width:7em;height:8.4em;border:6px solid var(--chalk);border-radius:30px 30px 18px 18px;overflow:hidden;background:#0f1512}
.kwater{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#7fd0ff,#2b8fd6);transition:height .6s}
.kbody .bub{position:absolute;bottom:.2em;width:.5em;height:.5em;border-radius:50%;background:rgba(255,255,255,.6);animation:rise 1.4s infinite}
@keyframes rise{to{transform:translateY(-6em);opacity:0}}
.steam{font-size:1.6em;height:1.4em;text-align:center}
.ksent{background:var(--paper);color:var(--ink);border-radius:16px;padding:.5em .8em;font-weight:800;font-size:1.05em}
.ksent .base{color:#8a5a22;font-weight:900}
@media (max-width:520px){.kettle{grid-template-columns:1fr;justify-items:center}}
/* ---------- 7 lunchbox ---------- */
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45em;background:#d84a6b;border:6px solid #8f2140;border-radius:24px;padding:.5em}
.comp{background:#fff3f6;color:var(--ink);border-radius:14px;min-height:8em;padding:.4em;display:flex;flex-direction:column;gap:.25em;border:0;align-items:stretch;text-align:center}
.comp .lab{font-family:var(--disp);font-weight:900;font-size:1em}
.comp .in{font-size:.78em;font-weight:800;background:#ffd3de;border-radius:8px;padding:.1em .3em}
.chips{display:flex;flex-wrap:wrap;gap:.45em;justify-content:center;margin:.6em 0}
.food{border:0;border-radius:14px;padding:.25em .8em;min-height:60px;font-weight:900;color:var(--ink);background:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.food.sel{outline:5px solid var(--mustard);transform:translateY(-3px)}
@media (max-width:640px){.comp .lab{font-size:.72em;word-break:keep-all;overflow-wrap:normal}.bento{gap:.3em;padding:.35em}.comp{padding:.3em .2em}}
/* ---------- 8 dishwasher ---------- */
.dw{background:#cfd6db;border:5px solid #808a91;border-radius:22px;padding:.6em;color:var(--ink)}
.rack{display:flex;align-items:center;gap:.5em;border-top:6px solid #808a91;padding:.4em .3em;min-height:4em;flex-wrap:wrap}
.rack .rl{font-family:var(--disp);font-weight:900;font-size:1.35em;width:2.2em;height:2.2em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;flex:none}
.rack button.rl{border:0;min-width:64px;min-height:64px}
.rack .pl{width:3.2em;height:3.2em;border-radius:50%;border:4px solid #8aa0ad;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.6em;font-weight:900;line-height:1.05;padding:.2em}
.plates{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;margin:.6em 0}
.plate{width:5.4em;height:5.4em;border-radius:50%;border:5px solid #b7c6cf;background:#fff;color:var(--ink);font-weight:900;font-size:.9em;line-height:1.1;padding:.2em}
.plate.sel{border-color:var(--mustard);box-shadow:0 0 0 5px var(--mustard)}
/* ---------- 9 fruit ---------- */
.slip{background:var(--paper);color:var(--ink);border-radius:6px;padding:.6em .9em;font-weight:800;font-size:1.1em;border-left:10px solid var(--tomato);margin:.4em 0}
.slip .ans{display:block;margin-top:.3em;color:#555;font-weight:700}
.bowl{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;padding:1em .6em .8em;border-radius:0 0 200px 200px;background:linear-gradient(#8b5a2b,#5e3a17);border:5px solid #3a230d;margin-top:.6em}
.fruit{border:0;border-radius:50%;width:5.6em;height:5.6em;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:.85em;color:var(--ink);background:var(--fc);box-shadow:inset -8px -8px 0 rgba(0,0,0,.15),0 5px 0 rgba(0,0,0,.35);line-height:1.05}
.fruit .fe{font-size:1.7em}
.fruit.no{animation:shake .45s}
/* ---------- 10 memory ---------- */
.lfbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr));gap:.5em;background:#8b6236;border:6px solid #4f3418;border-radius:18px;padding:.6em}
.mc{perspective:800px;border:0;background:transparent;padding:0;min-height:8.2em}
.mc .in{position:relative;width:100%;height:100%;min-height:8.2em;transition:transform .45s;transform-style:preserve-3d}
.mc.flip .in{transform:rotateY(180deg)}
.mc .face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:.4em;backface-visibility:hidden;font-weight:800;font-size:.82em;line-height:1.2;text-align:center}
.mc .back{background:repeating-linear-gradient(45deg,#e9cfa4 0 10px,#dcbc87 10px 20px);color:#6b4a2b;font-size:2.2em}
.mc .front{transform:rotateY(180deg);background:var(--paper);color:var(--ink);border:4px solid var(--grape)}
.mc .front.fix{border-color:var(--mint)}
.mc.got .front{background:#e8ffe9}
.mc .tag{display:block;font-size:.75em;font-weight:900;color:#7a5a12}
/* ---------- 11 toaster ---------- */
.msg{background:var(--paper);color:var(--ink);border-radius:18px 18px 18px 4px;padding:.55em .9em;font-weight:800;margin:.4em 0;max-width:30em}
.msg b{display:block;font-size:.8em;color:#7a5a12}
.toaster{position:relative;margin-top:.5em;padding-top:.5em}
.toasts{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:.5em;position:relative;z-index:1}
.toast{border:0;border-radius:26px 26px 10px 10px;background:linear-gradient(#f3c37c,#d49546);color:var(--ink);padding:.6em .7em;min-height:7em;font-weight:800;font-size:.92em;box-shadow:inset 0 0 0 6px #b67a33;animation:up .6s ease-out}
@keyframes up{from{transform:translateY(60px)}to{transform:translateY(0)}}
.toast.burnt{background:linear-gradient(#5a4130,#2f2219);color:#d9c7b4;text-decoration:line-through}
.tbody{height:2.4em;border-radius:0 0 30px 30px;background:linear-gradient(#c7cdd2,#8e979d);border:5px solid #6d767c;margin-top:-.8em;position:relative;z-index:2}
/* ---------- 12/13 teacher ---------- */
.wb{background:#fdfdfb;color:var(--ink);border:10px solid #9aa3a8;border-radius:12px;padding:.7em 1em;box-shadow:0 8px 0 #0b0f0d}
.wb h3{margin:.1em 0 .3em;font-family:var(--disp);font-weight:900;color:#1e5fb3}
.tick{display:flex;align-items:center;gap:.6em;width:100%;text-align:left;border:4px solid var(--line);background:var(--board2);border-radius:16px;min-height:64px;padding:.3em .7em;margin:.35em 0;font-weight:700}
.tick > span:last-child{overflow-wrap:anywhere;min-width:0}

function renderRoom(r){

var CUPC = ["#ff6b5b", "#ffc94d", "#5fe0a6", "#5cc4ff", "#c39bff", "#ffa47a", "#ff8fc6", "#c6f06a"];
function renderDoor(){
  document.documentElement.style.setProperty("--rc", "var(--mint)");
  if(doneN() < ROOMS.length){ S.v = "map"; render(); return; }
  if(!S.door || !S.door.order){ S.door = {order:shuffle(range(ROOMS.length)), placed:[]}; save(); }
  var D = S.door, slots = [5, 3, 5], f = h("div", {"aria-live":"polite"});
  add(main, [sign("🚪", "The door", "Use your 13 letters"), hideko("The door has a word lock. The code is one of our expressions. It means: Goodbye. See you soon. Three words: 5 letters, 3 letters, 5 letters. 🤔")]);
  var lock = h("div", {cls:"dlock"}), cups = h("div", {cls:"cups"});
  add(main, [lock, f, cups, h("div", {cls:"row", style:"justify-content:center;margin-top:.6em"}, h("button", {cls:"bb sm", onclick:function(){ D.placed = []; f.innerHTML = ""; save(); draw(); }}, "↺ Clear the lock"))]);
  function draw(){
    lock.innerHTML = ""; var p = 0;
    slots.forEach(function(n){ var w = h("div", {cls:"dword"}); for(var j = 0; j < n; j++){ var k = D.placed[p++]; w.appendChild(h("span", {cls:"dslot" + (k != null ? " full" : "")}, k != null ? ROOMS[k].letter : "")); } lock.appendChild(w); });

  }

    else { shake(lock); f.appendChild(fb(false, "The lock doesn't open. Clear it and try again.")); }

}
function renderEnd(){

function confetti(){
  var c = document.getElementById("conf"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  if(REDUCED) return;
  var cols = ["#ff6b5b", "#ffc94d", "#5fe0a6", "#5cc4ff", "#c39bff", "#ffa47a", "#ff8fc6", "#c6f06a"], P = [];
  for(var i = 0; i < 240; i++) P.push({x:Math.random() * c.width, y:-20 - Math.random() * c.height, w:8 + Math.random() * 8, hh:5 + Math.random() * 6, vy:2 + Math.random() * 4, vx:-1.5 + Math.random() * 3, r:Math.random() * 6, vr:-.2 + Math.random() * .4, c:cols[i % cols.length]});
  var t0 = Date.now();
  (function step(){ x.clearRect(0, 0, c.width, c.height); var alive = Date.now() - t0 < 7000;
    for(var i = 0; i < P.length; i++){ var p = P[i]; p.y += p.vy; p.x += p.vx; p.r += p.vr; if(p.y > c.height && alive) p.y = -10;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.hh / 2, p.w, p.hh); x.restore(); }
    if(Date.now() - t0 < 9000) requestAnimationFrame(step); else x.clearRect(0, 0, c.width, c.height); })();
}
